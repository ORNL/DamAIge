[project]
name = "mpex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.12.0",
    "datafold>=1.0.0",
    "distinctipy>=1.3.4",
    "h5py>=3.15.1",
    "igraph>=1.0.0",
    "ipykernel>=7.1.0",
    "jax",
    "jax[cuda12]>=0.10.2; sys_platform == 'linux'",
    "jupyter>=1.1.1",
    "legacy-cgi>=2.6.4",
    "leidenalg>=0.11.0",
    "matplotlib>=3.10.7",
    "networkx>=3.5",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "patchify>=0.1.1",
    "pip>=26.1.2",
    "python-louvain>=0.16",
    "pywavelets>=1.9.0",
    "retinex>=0.0.1",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "surfalize>=0.16.6",
    "timm>=1.0.24",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "transformers==4.46.3",
    "umap-learn>=0.5.9.post2",
]

[tool.uv.workspace]
members = [
    "label-studio-env",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
